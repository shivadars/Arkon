<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="assets/logo/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkon Medical Systems</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f5f5;
            --card-size: 440px;
            --card-radius: 56px;
            --font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --spring-easing: cubic-bezier(0.34, 1.4, 0.64, 1);
            --smooth-easing: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-family);
            overflow-x: hidden;
            perspective: 1200px;
            padding: 20px;
        }

        /* 3D Perspective Container */
        .socials-card-wrapper {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Card */
        .socials-card {
            position: relative;
            width: var(--card-size);
            height: var(--card-size);
            max-width: 90vw;
            max-height: 90vw;
            aspect-ratio: 1 / 1;
            border-radius: var(--card-radius);
            background: linear-gradient(135deg, 
                #6b11ff 0%, 
                #a800b7 25%, 
                #e8006b 50%, 
                #ff3d3d 72%, 
                #ff8800 88%, 
                #ffb700 100%
            );
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 30px 70px -15px rgba(232, 0, 107, 0.45),
                0 15px 35px -10px rgba(107, 17, 255, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.5);
            overflow: hidden;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.25s var(--smooth-easing), box-shadow 0.3s ease;
            user-select: none;
        }

        .socials-card:hover {
            box-shadow: 
                0 40px 85px -15px rgba(232, 0, 107, 0.55),
                0 20px 45px -10px rgba(107, 17, 255, 0.4),
                inset 0 1px 3px rgba(255, 255, 255, 0.7);
        }

        /* Subtle Ambient Glow inside Card */
        .card-ambient-glow {
            position: absolute;
            top: -20%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* "Socials" Text */
        .socials-title {
            position: absolute;
            top: 36px;
            right: 42px;
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            z-index: 5;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            pointer-events: none;
            transform: translateZ(30px);
            transition: transform 0.25s var(--smooth-easing);
        }

        /* Nested Glass Panels Container */
        .panels-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Common Panel Styles */
        .glass-panel {
            position: absolute;
            bottom: -35px;
            left: -35px;
            border-radius: 54px;
            border: 1.5px solid rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.7),
                0 15px 35px rgba(0, 0, 0, 0.12);
            pointer-events: auto;
            transform-origin: bottom left;
            opacity: 0;
            transform: translate(-90px, 90px) scale(0.75);
            transition: 
                transform 0.3s var(--smooth-easing), 
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }

        /* Entrance Animations */
        .socials-card.is-animated .glass-panel {
            opacity: 1;
            transform: translate(0, 0) scale(1);
        }

        /* Layer 1: Outer / Largest Panel (Instagram) */
        .panel-layer-1 {
            width: 325px;
            height: 325px;
            background: linear-gradient(135deg, 
                rgba(145, 0, 255, 0.42) 0%, 
                rgba(235, 0, 120, 0.32) 100%
            );
            z-index: 2;
            transition: 
                opacity 0.8s var(--spring-easing) 0.1s,
                transform 0.8s var(--spring-easing) 0.1s,
                box-shadow 0.3s ease;
        }

        /* Layer 2: Middle Panel (Twitter / X) */
        .panel-layer-2 {
            width: 245px;
            height: 245px;
            border-radius: 48px;
            background: linear-gradient(135deg, 
                rgba(0, 130, 255, 0.48) 0%, 
                rgba(0, 210, 255, 0.32) 100%
            );
            z-index: 3;
            transition: 
                opacity 0.8s var(--spring-easing) 0.22s,
                transform 0.8s var(--spring-easing) 0.22s,
                box-shadow 0.3s ease;
        }

        /* Layer 3: Inner / Smallest Panel (Discord) */
        .panel-layer-3 {
            width: 165px;
            height: 165px;
            border-radius: 42px;
            background: linear-gradient(135deg, 
                rgba(80, 160, 255, 0.58) 0%, 
                rgba(150, 210, 255, 0.42) 100%
            );
            z-index: 4;
            transition: 
                opacity 0.8s var(--spring-easing) 0.34s,
                transform 0.8s var(--spring-easing) 0.34s,
                box-shadow 0.3s ease;
        }

        /* Parallax Transitions after initial entrance */
        .socials-card.ready .glass-panel {
            transition: transform 0.2s var(--smooth-easing), box-shadow 0.3s ease;
        }

        /* Social Icon Anchor Links */
        .social-link {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.25s var(--spring-easing), background 0.2s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }

        .social-link:hover {
            transform: scale(1.15) translateZ(10px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .social-link svg {
            fill: #ffffff;
            transition: transform 0.2s ease;
        }

        /* Icon Position 1 (Instagram on Layer 1) */
        .icon-instagram {
            width: 48px;
            height: 48px;
            top: 36px;
            right: 36px;
        }
        .icon-instagram svg {
            width: 24px;
            height: 24px;
        }

        /* Icon Position 2 (Twitter/X on Layer 2) */
        .icon-twitter {
            width: 44px;
            height: 44px;
            top: 32px;
            right: 32px;
        }
        .icon-twitter svg {
            width: 20px;
            height: 20px;
        }

        /* Icon Position 3 (Discord on Layer 3) */
        .icon-discord {
            width: 40px;
            height: 40px;
            top: 28px;
            right: 28px;
        }
        .icon-discord svg {
            width: 20px;
            height: 20px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 480px) {
            :root {
                --card-size: 340px;
                --card-radius: 46px;
            }

            .socials-title {
                font-size: 30px;
                top: 28px;
                right: 32px;
            }

            .panel-layer-1 {
                width: 250px;
                height: 250px;
                border-radius: 44px;
                bottom: -25px;
                left: -25px;
            }

            .panel-layer-2 {
                width: 190px;
                height: 190px;
                border-radius: 38px;
                bottom: -25px;
                left: -25px;
            }

            .panel-layer-3 {
                width: 130px;
                height: 130px;
                border-radius: 32px;
                bottom: -20px;
                left: -20px;
            }

            .icon-instagram {
                width: 42px;
                height: 42px;
                top: 28px;
                right: 28px;
            }
            .icon-instagram svg { width: 20px; height: 20px; }

            .icon-twitter {
                width: 38px;
                height: 38px;
                top: 24px;
                right: 24px;
            }
            .icon-twitter svg { width: 18px; height: 18px; }

            .icon-discord {
                width: 34px;
                height: 34px;
                top: 20px;
                right: 20px;
            }
            .icon-discord svg { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>

    <div class="socials-card-wrapper">

            <!-- Ambient Glow -->
            <div class="card-ambient-glow"></div>

            <!-- "Socials" Title -->
            <h2 class="socials-title">Socials</h2>

            <!-- Nested Glass Panels -->
            <div class="panels-container">

                <!-- Layer 1: Purple/Pink Glass with Instagram -->
                <div class="glass-panel panel-layer-1" data-depth="20">

                    </a>
                </div>

            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('socialsCard');
            const panels = card.querySelectorAll('.glass-panel');
            const title = card.querySelector('.socials-title');

            // Trigger entrance animation
            setTimeout(() => {
                card.classList.add('is-animated');
            }, 100);

            // Mark ready for smooth mouse parallax after entrance finishes
            setTimeout(() => {
                card.classList.add('ready');
            }, 1000);

            // Smooth 3D Tilt & Parallax on Mouse Move
            let bounds;
            let rafId = null;

            function updateCardTransform(e) {
                if (!bounds) bounds = card.getBoundingClientRect();
                
                const mouseX = e.clientX - bounds.left;
                const mouseY = e.clientY - bounds.top;

                const centerX = bounds.width / 2;
                const centerY = bounds.height / 2;

                const percentX = (mouseX - centerX) / centerX;
                const percentY = (mouseY - centerY) / centerY;

                // Max tilt angles
                const maxTilt = 14;
                const tiltX = -percentY * maxTilt;
                const tiltY = percentX * maxTilt;

                // Apply 3D rotation to main card
                card.style.transform = `rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg)`;

                // Parallax depth for nested panels and title
                panels.forEach(panel => {
                    const depth = parseFloat(panel.getAttribute('data-depth')) || 25;
                    const moveX = percentX * (depth * 0.35);
                    const moveY = percentY * (depth * 0.35);
                    panel.style.transform = `translate3d(${moveX.toFixed(1)}px, ${moveY.toFixed(1)}px, ${depth}px)`;
                });

                if (title) {
                    title.style.transform = `translate3d(${percentX * 8}px, ${percentY * 8}px, 35px)`;
                }
            }

            card.addEventListener('mouseenter', () => {
                bounds = card.getBoundingClientRect();
            });

            card.addEventListener('mousemove', (e) => {
                if (rafId) cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(() => updateCardTransform(e));
            });

            card.addEventListener('mouseleave', () => {
                if (rafId) cancelAnimationFrame(rafId);
                card.style.transform = 'rotateX(0deg) rotateY(0deg)';
                panels.forEach(panel => {
                    panel.style.transform = 'translate3d(0, 0, 0)';
                });
                if (title) {
                    title.style.transform = 'translate3d(0, 0, 30px)';
                }
            });

            // Re-calculate bounds on window resize
            window.addEventListener('resize', () => {
                bounds = card.getBoundingClientRect();
            });
        });
    </script>
</body>
</html>
